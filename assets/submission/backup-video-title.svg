<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">MoveRealm camera-free backup demo</title>
  <desc id="description">Turn any room into an adaptive movement adventure. Synthetic narration and guided keyboard controls; no human pose measurements.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#020a08" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#020a08" stop-opacity=".72"/>
      <stop offset="1" stop-color="#020a08" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <image href="moverealm-cover-source.png" width="1440" height="810" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1440" height="810" fill="url(#shade)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#effff7">
    <text x="82" y="93" font-size="20" font-weight="700" fill="#75f6bd" letter-spacing="6">MOVEREALM</text>
    <text x="82" y="222" font-size="78" font-weight="700">Your room.</text>
    <text x="82" y="307" font-size="78" font-weight="700">A world that listens.</text>
    <text x="82" y="367" font-size="27" fill="#c9dfd4">Turn any room into an adaptive movement adventure.</text>
    <rect x="82" y="458" width="500" height="58" rx="29" fill="#8dffca"/>
    <text x="112" y="495" font-size="20" font-weight="700" fill="#03130d" letter-spacing="2">CAMERA-FREE BACKUP DEMO</text>
    <text x="82" y="574" font-size="21" fill="#effff7">Synthetic narration · guided keyboard controls</text>
    <text x="82" y="610" font-size="21" fill="#effff7">No person shown · no human pose measurements claimed</text>
    <line x1="82" y1="681" x2="570" y2="681" stroke="#75f6bd" stroke-width="2"/>
    <text x="82" y="724" font-size="17" fill="#bcd5c9">Public demo: ming3465.github.io/MoveRealm</text>
    <text x="82" y="755" font-size="17" fill="#bcd5c9">Source: github.com/ming3465/MoveRealm</text>
  </g>
</svg>
